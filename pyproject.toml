[project]
name = "audiobook"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard] (>=0.128.0,<0.129.0)",
    "sqlmodel (>=0.0.31,<0.0.32)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "torch (==2.6.0)",
    "torchvision (==0.21.0)",
    "torchaudio (==2.6.0)",
    "f5-tts (>=1.1.5)",
    "habibi-tts (>=0.1.1)",
    "s3tokenizer (>=0.3.0)",
    "conformer (==0.3.2)",
    "diffusers (==0.29.0)",
    "resemble-perth (>=1.0.1)",
    # chatterbox-tts is installed with: poetry run pip install chatterbox-tts --no-deps
    # (its pkuseg build fails on Windows; runtime deps are listed above)
    "redis (>=5.2.0,<6.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "ruff (>=0.15.2,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "clerk-backend-api (>=5.0.2,<6.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "soundfile (>=0.12.1,<0.13.0)",
    "groq (>=0.22.0,<1.0.0)",
    "httpx (>=0.28.0,<0.29.0)",
    "boto3 (>=1.35.0,<2.0.0)",
    "cached-path (>=1.6.0,<2.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "datasets (>=4.8.5,<5.0.0)",
    "pyarrow (>=24.0.0,<25.0.0)",
    "huggingface-hub (>=0.30.0)",
    # ctc-forced-aligner passes dtype= into from_pretrained.
    "transformers (>=4.57.6,<5.0.0)",
]

[tool.poetry.group.preprocess]
optional = true

[tool.poetry.group.preprocess.dependencies]
ctc-forced-aligner = {git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner.git"}
silero-vad = ">=5.1.2"
deepfilternet = ">=0.5.6"
appdirs = ">=1.4.4"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
